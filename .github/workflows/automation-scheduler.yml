name: ZEESHAN AI LABS - Automation Scheduler

on:
  schedule:
    # Check every 15 minutes for worldwide schedule windows.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      region:
        description: "Region to run"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - USA
          - UK
          - EUROPE
          - MIDDLE_EAST

      execute:
        description: "Execute automation"
        required: true
        default: false
        type: boolean


permissions:
  contents: write


concurrency:
  group: zeeshan-ai-automation-scheduler
  cancel-in-progress: false


jobs:

  automation:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # NODE.JS
      # ------------------------------------------------------------

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ------------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install dependencies
        run: npm install


      # ------------------------------------------------------------
      # ENVIRONMENT CHECK
      # ------------------------------------------------------------

      - name: Prepare automation environment
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          CEO_AUTOMATION_MODE: ${{ secrets.CEO_AUTOMATION_MODE }}
          CEO_EMERGENCY_STOP: ${{ secrets.CEO_EMERGENCY_STOP }}

        run: |
          echo "=============================================="
          echo " ZEESHAN AI LABS - ENVIRONMENT CHECK"
          echo "=============================================="

          if [ -n "$AI_API_KEY" ]; then
            echo "Gemini/API key: CONFIGURED"
          else
            echo "Gemini/API key: NOT_CONFIGURED"
          fi

          if [ -n "$ELEVENLABS_API_KEY" ] && [ -n "$ELEVENLABS_VOICE_ID" ]; then
            echo "ElevenLabs: CONFIGURED"
          else
            echo "ElevenLabs: NOT_CONFIGURED"
          fi

          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "YouTube OAuth: CONFIGURED"
          else
            echo "YouTube OAuth: NOT_CONFIGURED"
          fi

          echo "Automation target: 5 Shorts/day"
          echo "Hard daily maximum: DISABLED"
          echo "Additional strong topics: ALLOWED"
          echo "CEO safety controls: ENABLED"
          echo "=============================================="


      # ------------------------------------------------------------
      # RUN WORLDWIDE AUTOMATION
      # ------------------------------------------------------------

      - name: Run worldwide automation
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          CEO_AUTOMATION_MODE: ${{ secrets.CEO_AUTOMATION_MODE }}
          CEO_EMERGENCY_STOP: ${{ secrets.CEO_EMERGENCY_STOP }}

          INPUT_REGION: ${{ github.event.inputs.region }}
          INPUT_EXECUTE: ${{ github.event.inputs.execute }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

        run: |
          node --input-type=module <<'NODE'

          import {
            runScheduledRegion,
            runScheduledAutomation,
            previewScheduledAutomation
          } from "./src/scheduledAutomationRunner.js";


          const eventName =
            process.env.GITHUB_EVENT_NAME || "";


          let region;
          let execute;


          /*
           * Scheduled GitHub Actions runs do not have
           * workflow_dispatch inputs.
           *
           * Therefore scheduled runs must execute
           * automatically instead of falling back
           * to preview mode.
           */

          if (eventName === "schedule") {

            region = "ALL";

            execute = true;

          } else {

            region =
              process.env.INPUT_REGION || "ALL";

            execute =
              String(
                process.env.INPUT_EXECUTE || "false"
              ).toLowerCase() === "true";
          }


          console.log("");
          console.log("==============================================");
          console.log(" ZEESHAN AI LABS - AUTOMATION SCHEDULER");
          console.log("==============================================");
          console.log("GitHub event:", eventName);
          console.log("Region:", region);
          console.log("Execute:", execute);
          console.log("Daily target: 5");
          console.log("Hard daily maximum: DISABLED");
          console.log("USA: ENABLED");
          console.log("UK: ENABLED");
          console.log("EUROPE: ENABLED");
          console.log("MIDDLE EAST: ENABLED");
          console.log("More than 5 allowed when strong topics exist.");
          console.log("Weak topics must not be forced.");
          console.log("Risky topics must go through approval.");
          console.log("==============================================");
          console.log("");


          let result;


          if (!execute) {

            console.log(
              "Preview mode - no automation execution."
            );

            result =
              await previewScheduledAutomation({
                region
              });

          } else if (region === "ALL") {

            console.log(
              "Executing worldwide scheduled automation..."
            );

            result =
              await runScheduledAutomation();

          } else {

            console.log(
              `Executing scheduled automation for ${region}...`
            );

            result =
              await runScheduledRegion({
                region
              });
          }


          console.log("");
          console.log("AUTOMATION RESULT:");
          console.log(
            JSON.stringify(
              result,
              null,
              2
            )
          );
          console.log("");


          /*
           * --------------------------------------------------------
           * SCHEDULE SKIP IS NOT AN ERROR
           * --------------------------------------------------------
           *
           * GitHub Actions checks every 15 minutes.
           *
           * Most runs will NOT fall inside a valid regional
           * schedule window.
           *
           * These statuses are therefore successful no-op runs.
           */

          const successfulSkipStatuses = [
            "OUTSIDE_SCHEDULE_WINDOW",
            "SCHEDULED_AUTOMATION_SKIPPED",
            "SCHEDULE_PREVIEW"
          ];


          const isSuccessfulSkip =
            successfulSkipStatuses.includes(
              result?.status
            );


          /*
           * --------------------------------------------------------
           * ACTUAL FAILURE CHECK
           * --------------------------------------------------------
           *
           * Only real automation failures should make
           * GitHub Actions exit with code 1.
           */

          if (
            result?.success === false &&
            !isSuccessfulSkip
          ) {

            console.error("");
            console.error(
              "REAL AUTOMATION FAILURE DETECTED."
            );
            console.error(
              "Status:",
              result?.status || "UNKNOWN"
            );
            console.error(
              "Reason:",
              result?.reason || "No reason provided."
            );
            console.error("");

            process.exitCode = 1;

          } else {

            console.log(
              "Automation scheduler completed successfully."
            );

            if (isSuccessfulSkip) {
              console.log(
                "This run was a normal schedule skip/no-op."
              );
            }
          }

          NODE


      # ------------------------------------------------------------
      # PERSIST AUTOMATION STATE
      # ------------------------------------------------------------

      - name: Persist automation state
        if: always()
        run: |

          mkdir -p storage/automation

          git config user.name \
            "ZEESHAN AI LABS Automation"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add storage/automation

          if git diff --cached --quiet; then

            echo "No automation state changes to commit."

          else

            git commit \
              -m "chore: persist automation state"

            git push

          fi