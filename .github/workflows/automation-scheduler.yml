name: ZEESHAN AI LABS - Automation Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      region:
        description: "Region to execute"
        required: false
        default: "ALL"
        type: choice
        options:
          - ALL
          - USA
          - UK
          - EUROPE

      execute:
        description: "Run real automation"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zeeshan-ai-automation
  cancel-in-progress: false

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run scheduled automation
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          CEO_AUTOMATION_MODE: ${{ secrets.CEO_AUTOMATION_MODE }}
          CEO_EMERGENCY_STOP: ${{ secrets.CEO_EMERGENCY_STOP }}

        run: |
          node --input-type=module <<'NODE'
          import {
            executeScheduledAutomation,
            previewScheduledAutomation
          } from "./src/scheduledAutomationRunner.js";

          const isManual =
            process.env.GITHUB_EVENT_NAME === "workflow_dispatch";

          const requestedRegion =
            isManual
              ? "${{ inputs.region }}"
              : "ALL";

          const executeInput =
            isManual
              ? "${{ inputs.execute }}" === "true"
              : true;

          const regions =
            requestedRegion === "ALL"
              ? ["USA", "UK", "EUROPE"]
              : [requestedRegion];

          const results = [];

          for (const region of regions) {
            const result = executeInput
              ? await executeScheduledAutomation({ region })
              : await previewScheduledAutomation({ region });

            results.push({
              region,
              result
            });
          }

          console.log(
            JSON.stringify(
              {
                success: true,
                mode: executeInput ? "EXECUTE" : "DRY_RUN",
                regions,
                results
              },
              null,
              2
            )
          );

          const hardFailures =
            results.filter(
              ({ result }) =>
                result?.success !== true &&
                ![
                  "OUTSIDE_SCHEDULE",
                  "DAILY_LIMIT_REACHED",
                  "EMERGENCY_STOP",
                  "AUTOMATION_STOPPED",
                  "SCHEDULE_NOT_ELIGIBLE"
                ].includes(result?.status)
            );

          if (hardFailures.length > 0) {
            process.exit(1);
          }
          NODE

      - name: Persist automation state
        if: always()
        run: |
          mkdir -p storage/automation

          git config user.name "ZEESHAN AI LABS Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add storage/automation/

          if git diff --cached --quiet; then
            echo "No automation state changes to commit."
          else
            git commit -m "chore: persist automation state"
            git push
          fi